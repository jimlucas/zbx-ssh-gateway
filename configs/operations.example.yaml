operations:
  device.version:
    command: "show version"
    parameters: {}
    timeout_seconds: 10
    max_output_bytes: 65536

  radio.stats:
    command: "radio stats ${interface}"
    parameters:
      interface:
        type: enum
        values: ["wlan0", "wlan1"]
        required: true
    timeout_seconds: 10
    max_output_bytes: 65536
